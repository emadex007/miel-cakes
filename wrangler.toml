name = "miel-cakes"
main = "./src/server.ts"
compatibility_date = "2025-09-02"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
routes = [
  { pattern = "mielcakes.com", custom_domain = true },
  { pattern = "www.mielcakes.com", custom_domain = true },
]
# --- D1 database (settings, menu, delivery areas, customers, orders, bookings) ---
# Create with:  npx wrangler d1 create miel_cakes_db
# then paste the returned database_id below.
[[d1_databases]]
binding = "DB"
database_name = "miel_cakes_db"
database_id = "2f5a1e77-24b4-4410-b87f-7612a7544b91"
migrations_dir = "migrations"

# --- R2 bucket (menu photos, videos, logo, gallery) ---
# Create with:  npx wrangler r2 bucket create miel-cakes-media
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "miel-cakes-media"

[observability]
enabled = true

# --- Secrets: set with `npx wrangler secret put <NAME>`, never commit them ---
# PAYSTACK_SECRET_KEY   Paystack checkout and booking deposits   (Phase 3)
# RESEND_API_KEY        alerts, customer emails, festive emails  (see README: Turning on emails)

# No cron schedule: the free plan allows only 5 per Cloudflare account and they're used up.
# Festive email batches are sent by the site itself as people visit (see src/server.ts).

[vars]
SITE_ENV = "production"
CANONICAL_HOST = "mielcakes.com"
